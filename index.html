<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Times New Roman", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 450px;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            font-size: 16px;
            color: #4b5563;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background-color: #e5e7eb;
            width: 100%;
            margin-bottom: 24px;
        }

        .return-box {
            background-color: #f3f4f6;
            padding: 12px 16px;
            border-radius: 6px;
            display: inline-block;
        }

        .return-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .return-date {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">

        
        <h1>Under Maintenance</h1>
        
        <p>I'm currently upgrading stuff. Be back online soon.</p>
        
        <div class="divider"></div>
        
        <div class="return-box">
            <div class="return-label">Estimated Return</div>
            <div class="return-date">June 15-19</div>
        </div>
    </div>

</body>
</html>
