<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <title>Aetriq | Contact</title>
    
    <link rel="shortcut icon" type="image/png" href="assets/img/AetriqDynamicsthumb.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo fade-up visible">
            <img src="assets/img/AetriqDynamics 1.0.png" alt="Aetriq Logo">
            <div class="logo-text">Aetriq</div>
        </div>
        <button class="mobile-menu-btn">Menu</button>
        <ul class="nav-links fade-up visible" style="transition-delay: 100ms;">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="models.html">3D Models</a></li>
            <li><a href="tech.html">Tech Stack</a></li>
            <li><a href="creative.html">Creative Work</a></li>
            <li><hr class="nav-divider"></li>
            <li><a href="store.html">Storefront</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <section id="contact" class="section">
            <div class="container fade-up">
                <h2>Get In Touch</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 50px; margin-top: 30px;">
                    
                    <div class="project-card" style="padding: 40px; box-shadow: none; min-height: auto;">
                        <p style="font-size: 1.1rem; line-height: 1.6;">I also offer 3D printing services and specialized repair for electronics. Message me for quotes!</p>
                        
                        <h3 style="margin-top: 30px; margin-bottom: 10px; font-size: 1.2rem; color: var(--primary-text);">Email</h3>
                        <p><a href="mailto:aetriq@protonmail.com" style="color: var(--accent-red); font-weight: bold; text-decoration: none; font-family: 'JetBrains Mono', monospace;">aetriq@protonmail.com</a></p>
                        
                        <h3 style="margin-top: 30px; margin-bottom: 10px; font-size: 1.2rem; color: var(--primary-text);">Location</h3>
                        <p style="font-family: 'JetBrains Mono', monospace; opacity: 0.8;">Ottawa, Ontario, Canada</p>
                    </div>
                    
                    <div>
                        <form id="contactForm">
                            <input type="text" class="form-control" placeholder="Name" required aria-label="Name">
                            <input type="email" class="form-control" placeholder="Email" required aria-label="Email">
                            <textarea class="form-control" placeholder="Message" rows="5" required aria-label="Message"></textarea>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Global Footer Injection Point -->
        <div id="global-footer"></div>
    </div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
