<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetriq | Contact</title>
    <link rel="shortcut icon" type="image/png" href="assets/img/AetriqDynamicsthumb.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="assets/img/AetriqDynamics 1.0.png" alt="Aetriq Logo">
            <div class="logo-text">Aetriq</div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="models.html">3D Models</a></li>
            <li><a href="tech.html">Tech Stack</a></li>
            <li><a href="creative.html">Creative Work</a></li>
            <li><a href="store.html">Storefront</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <section id="contact" class="section">
            <div class="container">
                <h2>Get In Touch</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 35px; margin-top: 20px;">
                    
                    <div class="project-card" style="padding: 25px;">
                        <p>I also offer 3D printing services and specialized repair for electronics. Message me for quotes!</p>
                        
                        <h3 style="margin-top: 25px; margin-bottom: 6px;">Email</h3>
                        <p><a href="mailto:aetriq@protonmail.com" style="color: var(--accent-red); font-weight: bold; text-decoration: none;">aetriq@protonmail.com</a></p>
                        
                        <h3 style="margin-top: 25px; margin-bottom: 6px;">Location</h3>
                        <p>Ottawa, Ontario, Canada</p>
                    </div>
                    
                    <div>
                        <form id="contactForm">
                            <input type="text" class="form-control" placeholder="Name" required aria-label="Name">
                            <input type="email" class="form-control" placeholder="Email" required aria-label="Email">
                            <textarea class="form-control" placeholder="Message" rows="5" required aria-label="Message"></textarea>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <div id="global-footer"></div>
    </div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
