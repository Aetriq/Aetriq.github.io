<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" type="image/png" href="assets/img/AetriqDynamicsthumb.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetriq's Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="logo fade-up visible">
            <img src="assets/img/AetriqDynamics 1.0.png" alt="Logo">
            <div class="logo-text">Aetriq Store</div>
        </div>
        <button class="mobile-menu-btn">☰ Menu</button>
        <ul class="nav-links fade-up visible" style="transition-delay: 100ms;">
            <li><a href="index.html">← Back to Main Site</a></li>
            <li><a href="#" class="active">Storefront</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="container section">
            <h1 class="fade-up visible">Storefront</h1>
            
            <div class="fade-up visible" style="max-width: 800px; margin-bottom: 40px; padding: 25px; background: rgba(255,255,255,0.03); border-left: 4px solid var(--accent-red); border-bottom: var(--border-subtle); transition-delay: 100ms;">
                <p style="margin: 0; font-size: 1.1rem;">Currently showing past inventory and specialized PC builds. All links redirect to my eBay listing page or Facebook Marketplace!</p>
            </div>

            <div class="store-grid" id="productGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <h3 style="margin:0; font-size:1.1rem; color: var(--primary-text);">Product Details</h3>
                <button class="close-btn" id="closeModalBtn">Close [X]</button>
            </div>
            <div class="modal-body">
                <div class="carousel-container">
                    <button class="carousel-btn carousel-prev" id="prevBtn">‹</button>
                    <img src="" alt="Product view" class="carousel-img" id="carouselImg">
                    <button class="carousel-btn carousel-next" id="nextBtn">›</button>
                    <div class="image-counter" id="imageCounter">1 / 1</div>
                </div>
                
                <div class="status-badge" id="modalStatusBadge">Status</div>
                <h2 id="modalTitle" style="border:none; margin: 10px 0; padding: 0;">Product Title</h2>
                <p id="modalDesc" style="white-space: pre-wrap; font-size: 1.05rem; color: var(--body-text);"></p>
                
                <button class="btn" id="modalActionBtn" style="width: 100%; margin-top: 10px;">Action</button>
            </div>
        </div>
    </div>

    <script src="assets/js/store.js"></script>
</body>
</html>
